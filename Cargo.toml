[workspace]
members = [
  "artifex-batch",
  "artifex-client-kit",
  "artifex-client-cli",
  "artifex-engine",
  "artifex-rpc",
  "artifex-server",
  "random-progression",
  "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
authors = ["Eric Le Bihan <eric.le.bihan.dev@free.fr>"]
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
result_large_err = "allow"
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"

[workspace.dependencies]
thiserror = "2.0.12"
tokio = { version = "1.52", features = ["full"] }
