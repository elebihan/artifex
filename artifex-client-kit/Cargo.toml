[package]
name = "artifex-client-kit"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Artifex client helpers"

[dependencies]
anyhow = { workspace = true }
artifex-rpc = { path = "../artifex-rpc" }
cryptoki = "0.12.0"
futures = { workspace = true }
hyper = "1.6.0"
hyper-rustls = { version = "0.27.5", features = ["http2", "ring"] }
hyper-util = { version = "0.1.11", features = [
  "client",
  "client-legacy",
  "http1",
  "http2",
  "tokio",
] }
pkcs8 = { version = "0.10.2", features = ["encryption", "pem"] }
rand = "^0.8"
rpassword = "7.4.0"
rsa = { version = "0.9.8", features = ["sha2"] }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26.2", features = ["ring"] }
tokio-stream = { version = "0.1.14", features = ["net"] }
toml = { workspace = true }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-reflection = "0.14"
tower = "0.5.2"
url = "2.5.4"

[lints]
workspace = true
